name: Build Arch package arm64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arch-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build ELF and Arch package in Arch Linux ARM
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: archarm_latest
          run: |
            set -e
            # The QEMU kernel used by this runner does not support Landlock.
            sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm \
              base-devel rust cargo pkgconf cmake git wayland
            useradd -m builder
            chown -R builder:builder "$PWD"
            su builder -s /bin/bash -c '
              set -e
              make arch
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: desktools-arch-arm64
          path: dist/desktools-*
          if-no-files-found: error

  release:
    name: Attach Arch package and ELF to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktools-arch-arm64
          path: release

      - name: Upload Arch package and ELF release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" release/desktools-* --clobber
