name: Build ELF arm64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-elf-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ELF (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libwayland-dev libxkbcommon-dev

      - name: Build ELF
        run: |
          cargo build --release --locked
          install -Dm755 target/release/desktools dist/desktools-aarch64

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: desktools-elf-arm64
          path: dist/desktools-aarch64
          if-no-files-found: error

  release:
    name: Attach ELF to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktools-elf-arm64
          path: release

      - name: Upload ELF release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" release/desktools-aarch64 --clobber
