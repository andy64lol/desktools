name: Build Arch package amd64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arch-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build ELF and Arch package
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel rust pkgconf wayland
              useradd -m builder
              chown -R builder:builder /work
              runuser -u builder -- env HOME=/home/builder make arch
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: desktools-arch-amd64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Attach Arch package to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktools-arch-amd64
          path: release

      - name: Upload Arch package release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" release/*.pkg.tar.zst --clobber
