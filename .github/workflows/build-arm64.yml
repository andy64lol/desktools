name: Build arm64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build package
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/work" \
            -w /work \
            menci/archlinuxarm:base-devel \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel rust
              useradd -m builder
              chown -R builder:builder /work
              runuser -u builder -- env HOME=/home/builder make arch
            '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: desktools-aarch64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Attach package to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktools-aarch64
          path: release

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" release/*.pkg.tar.zst --clobber
