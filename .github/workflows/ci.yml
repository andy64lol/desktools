name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel rust git

      - uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  package:
    name: Package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: archlinux:latest
            platform: linux/amd64
          - arch: aarch64
            image: menci/archlinuxarm:base-devel
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build package
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD:/work" \
            -w /work \
            ${{ matrix.image }} \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel rust
              useradd -m builder
              chown -R builder:builder /work
              runuser -u builder -- env HOME=/home/builder make arch
            '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: desktools-${{ matrix.arch }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -name '*.pkg.tar.zst' -exec cp {} release/ \;
          ls -l release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
